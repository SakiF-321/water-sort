<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaterSort Game</title>
    <link rel="stylesheet" href="style.css">
    <div id = "menu">
    <button id="selectStageButton">Select Stage</button>
    <button>Settings</button>
    </div>
</head>
<body>
   <h1 id="title">Hello Water Sort!</h1> 
   <div id="selectScreen"></div>

   <div id="game" class = "hidden">
    <h2 id = "moveCount">
    </h2>
    <div id = "tubeContainer">
    </div>
    <div id = "gameButtons">
        <button id = "resetButton" class = "button">Reset</button>
        <button id = "undoButton" class = "button">Undo</button>
        <button id = "addTubeButton" class = "button1">addTube</button>
    </div>
    </div>


   <div id = "clearScreen" class = "hidden">
    <h2>🎉 CLEAR! 🥂</h2>
    <h3 id="clearMoves"></h3>
    <button id = "retryButton" class = "button">Retry</button>
    <button id = "nextButton" class = "button">NextStage</button>
    </div>

   <script src="script.js"></script>
</body>
</html>
